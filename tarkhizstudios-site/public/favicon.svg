<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <!-- Gradientes de fundo e painéis -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b38" />
      <stop offset="100%" stop-color="#070d12" />
    </radialGradient>
    
    <linearGradient id="hex-outer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="50%" stop-color="#00bfff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Gradientes do símbolo T central -->
    <linearGradient id="t-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e1ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <linearGradient id="t-right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <linearGradient id="t-bottom-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffa2" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00bfff" />
    </linearGradient>

    <!-- Filtro de brilho -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Grupo centralizado -->
  <g transform="translate(250, 300)">
    
    <!-- Fundo escuro interno do escudo -->
    <polygon points="0,-240 208,-120 208,120 0,240 -208,120 -208,-120" fill="#0b131a" />
    <polygon points="0,-220 190,-110 190,110 0,220 -190,110 -190,-110" fill="#0f1923" />

    <!-- Símbolo T Central e Elementos -->
    <g filter="url(#glow)">
      <!-- Bloco Superior Esquerdo do T -->
      <polygon points="-25,-90 -95,-90 -75,-35 -25,-35" fill="url(#t-left-grad)" />
      
      <!-- Bloco Superior Direito do T -->
      <polygon points="25,-90 95,-90 75,-35 25,-35" fill="url(#t-right-grad)" />
      
      <!-- Diamante Central -->
      <polygon points="0,-65 15,-40 0,-15 -15,-40" fill="url(#diamond-grad)" />

      <!-- Haste Inferior do T -->
      <polygon points="-35,-20 35,-20 20,110 0,135 -20,110" fill="url(#t-bottom-grad)" />
    </g>

    <!-- Estrutura Externa Hexagonal (Bordas Tecnológicas) -->
    <!-- Hexágono base secundário -->
    <polygon points="0,-230 199,-115 199,115 0,230 -199,115 -199,-115" fill="none" stroke="#1c3a46" stroke-width="6" />

    <!-- Hexágono Principal com Gradiente Neon -->
    <polygon points="0,-245 212,-122 212,122 0,245 -212,122 -212,-122" fill="none" stroke="url(#hex-outer-grad)" stroke-width="8" filter="url(#glow)" />

    <!-- Detalhes Tecnológicos e Círculos nas Bordas -->
    <!-- Topo -->
    <circle cx="0" cy="-245" r="5" fill="#00ffcc" filter="url(#glow)" />
    <line x1="-30" y1="-265" x2="30" y2="-265" stroke="#00ffcc" stroke-width="3" />

    <!-- Esquerda -->
    <circle cx="-212" cy="122" r="6" fill="#00ffaa" filter="url(#glow)" />
    <path d="M-225,90 L-225,60" stroke="#00ffb7" stroke-width="4" />

    <!-- Direita -->
    <circle cx="212" cy="122" r="6" fill="#0066ff" filter="url(#glow)" />
    <path d="M225,90 L225,40" stroke="#0088ff" stroke-width="4" />
    <line x1="218" y1="10" x2="235" y2="10" stroke="#00bfff" stroke-width="3" />

    <!-- Linhas de circuito decorativas adicionais -->
    <path d="M-170,-190 L-130,-190" stroke="#00ffcc" stroke-width="2" opacity="0.7" />
    <path d="M130,-190 L170,-190" stroke="#00bfff" stroke-width="2" opacity="0.7" />
    
    <path d="M-192,0 L-205,0" stroke="#00ffcc" stroke-width="3" />
    <path d="M192,-30 L205,-30" stroke="#00bfff" stroke-width="3" />
  </g>
</svg>
