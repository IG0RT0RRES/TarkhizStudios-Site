<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Profundo -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="60%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradiente Primário do 'T' e Anel Externo (Verde Esmeralda p/ Ciano) -->
    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Gradiente Metálico Claro para Destaques/Bordas -->
    <linearGradient id="metal-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente Escuro Metálico para Recortes -->
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Efeito Neonzão / Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Brilho Suave para Texto -->
    <filter id="text-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do Container -->
  <rect width="800" height="450" fill="url(#bg-glow)" rx="16" />

  <!-- Grid de Background Tech (Linhas sutis no fundo) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- GRUPO DO ÍCONE / EMBLEMA -->
  <g transform="translate(400, 160)">
    
    <!-- Aura de Brilho de Fundo do Emblema -->
    <path d="M 0,-100 L 75,-45 L 75,45 L 0,100 L -75,45 L -75,-45 Z" 
          fill="none" 
          stroke="url(#emerald-cyan)" 
          stroke-width="15" 
          opacity="0.3" 
          filter="url(#neon-glow)" />

    <!-- Moldura Hexagonal Externa -->
    <path d="M 0,-105 L 80,-48 L 80,48 L 0,105 L -80,48 L -80,-48 Z" 
          fill="none" 
          stroke="url(#emerald-cyan)" 
          stroke-width="3" 
          stroke-dasharray="120 15 40 15" />

    <!-- Moldura Interna Cortada Tech -->
    <path d="M 0,-85 L 65,-38 L 65,38 L 0,85 L -65,38 L -65,-38 Z" 
          fill="url(#dark-metal)" 
          stroke="#334155" 
          stroke-width="2" />

    <!-- Detalhes em Circuito nos Cantos do Hexágono -->
    <circle cx="0" cy="-85" r="4" fill="#10b981" filter="url(#text-glow)" />
    <circle cx="65" cy="38" r="4" fill="#06b6d4" filter="url(#text-glow)" />
    <circle cx="-65" cy="38" r="4" fill="#06b6d4" filter="url(#text-glow)" />

    <!-- O "T" ESTILIZADO (Símbolo Principal) -->
    <!-- Asa Esquerda da Barra Superior do T -->
    <path d="M -50,-55 L -5,-55 L -15,-30 L -40,-30 Z" 
          fill="url(#emerald-cyan)" />

    <!-- Asa Direita da Barra Superior do T -->
    <path d="M 5,-55 L 50,-55 L 40,-30 L 15,-30 Z" 
          fill="url(#emerald-cyan)" />

    <!-- Corpo Central do T (Formato Dinâmico/Futurista) -->
    <path d="M -18,-22 L 18,-22 L 12,25 L 0,55 L -12,25 Z" 
          fill="url(#emerald-cyan)" 
          filter="url(#neon-glow)" />

    <!-- Núcleo Luminoso Central -->
    <polygon points="0,-48 8,-32 0,-15 -8,-32" fill="#ffffff" opacity="0.9" filter="url(#text-glow)" />
    
  </g>

  <!-- GRUPO DE TEXTO DE MARCA -->
  <g text-anchor="middle">
    
    <!-- NOME PRINCIPAL: TARKHIZ -->
    <text x="400" y="325" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="10"
          filter="url(#text-glow)">
      TARKHIZ
    </text>

    <!-- SUBTÍTULO: STUDIOS -->
    <text x="400" y="365" 
          fill="#06b6d4" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="700" 
          letter-spacing="14" 
          opacity="0.9">
      STUDIOS
    </text>

    <!-- Linhas Decorativas do Subtítulo -->
    <line x1="240" y1="360" x2="300" y2="360" stroke="url(#emerald-cyan)" stroke-width="2" stroke-linecap="round" />
    <line x1="500" y1="360" x2="560" y2="360" stroke="url(#emerald-cyan)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
